<style>
  .super-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 420px;
    padding: 20px;
    border-radius: 20px;
    border: 2px solid #ffb300;
    background: #0b0b2b;
    color: #ffb300;
    font-family: sans-serif;
    transition: box-shadow 0.3s ease, border-color 0.3s ease;
  }

  /* Formanın içindəki hər hansı input-a toxunulanda (focus) bütün form parlayır */
  .super-form:has(input:focus) {
    box-shadow: 0 0 25px rgba(255, 179, 0, 0.45);
  }

  /* Bütün tələb olunan xanalar düzgün dolanda formanın rəngi yaşıl-sarı enerjiyə keçir */
  .super-form:has(input[required]:valid):not(:has(input[required]:invalid)) {
    border-color: #39ff14;
    box-shadow: 0 0 25px rgba(57, 255, 20, 0.35);
  }

  .super-form input {
    padding: 10px 14px;
    border-radius: 12px;
    border: 2px solid #ffb300;
    background: #000;
    color: #fff;
    outline: none;
    transition: 0.25s ease;
  }

  .super-form input:user-valid {
    border-color: #39ff14;
  }

  .super-form input:user-invalid {
    border-color: #ff3b3b;
  }

  /* Gizli qeyd yalnız xana fokusda olanda görünür */
  .ipucu {
    font-size: 12px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    color: #ffd56b;
    transition: all 0.3s ease;
  }

  .xana-bloku:has(input:focus) .ipucu {
    opacity: 1;
    max-height: 40px;
    margin-top: 4px;
  }
</style>

<form class="super-form">
  <div class="xana-bloku">
    <input type="text" placeholder="Adın" required>
    <div class="ipucu">Sadəcə adını yazmaq kifayətdir.</div>
  </div>

  <div class="xana-bloku">
    <input type="email" placeholder="Email ünvanın" required>
    <div class="ipucu">Düzgün email formatı daxil et (məs: ad@mail.com).</div>
  </div>

  <button type="submit">Göndər</button>
</form>
