<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boş vaxt sorğusu</title>
    <link rel="icon" href='{{ url_for("static", filename="favicon.png") }}'>
    <style>

        body {
            background: linear-gradient(to right, #000000, #03009a, #000000);
            background-attachment: fixed;
            margin: 0;
            display: flex;
            justify-content: center;
            color: #ffb300;
        }
        
        form:invalid .göndər {
            opacity: 0.7;
            cursor: pointer;
        }

        span.progress-qutu {
            position: relative;
            display: flex;
            width: 100%;
            height: 15px;
            background: linear-gradient(90deg, red 0%, white 50%, red 100%);
            border: 2px solid #ffb300;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 20px;
            box-sizing: border-box;
        }

        span.dilim {
            flex: 1 1 0;
            height: 100%;
            background: rgba(10, 10, 35, 0.88);
            transform: scaleX(1);
            transform-origin: right center;
            transition: transform 1s ease;
        }

        form:has([name="name"]:valid) .d1,
        form:has([name="activity"]:valid) .d2,
        form:has([name="category"]:valid) .d3,
        form:has([name="companion"]:valid) .d4,
        form:has([name="age"]:valid) .d5,
        form:has([name="grade"]:valid) .d6,
        form:has([name="free_day"]:valid) .d7,
        form:has([name="hours_per_day"]:valid) .d8,
        form:has([name="satisfaction"]:valid) .d9,
        form:has([name="email"]:valid) .d10 {
            transform: scaleX(0);
        }

        button.göndər {
            box-sizing: border-box;
            width: 150px;
            display: flex;
            margin: 15px auto 25px auto;
            padding: 10px 20px;
            justify-content: center;
            align-items: center;
            background: linear-gradient(#000000, #03009a, #000000);
            border: 2px solid #ffb300;
            border-radius: 40px;
            color: #ffb300;
            cursor: grab !important;
        }
    
        button.sıfırla {
            box-sizing: border-box;
            width: 150px;
            display: flex;
            margin: auto;
            padding: 10px 20px;
            justify-content: center;
            align-items: center;
            background: linear-gradient(#000000, #03009a, #000000);
            border: 2px solid red;
            border-radius: 40px;
            color: red;
            cursor: grab;
        }
        
        label {
            display: block;
            margin-top: 18px;
            text-align: left;
        }
        
        input,
        select {
            width: 525px;
            padding: 8px;
            margin: 7px 0;
            box-sizing: border-box;
            background: linear-gradient(#000000, #03009a, #000000);
            border: 2px solid #ffb300;
            border-radius: 40px;
            color: #ffb300;
            outline: none;
        }
        
        option {
            border-radius: 20px;
            background-color: #000000;
            color: #ffb300;
        }
        
        div.conteiner {
            position: relative;
            max-height: 100%;
            max-width: 100%;
            background-color: transparent;
            margin-top: 15px;
            margin-bottom: 25px;
            padding: 10px 40px 15px 40px;
            border: 3px solid #ffb300;
            border-radius: 30px;
            box-shadow: 0 0 20px #ffb300;
        }
        
        div.container-3{
            position: relative;
            padding: 20px;
            max-height: 100%;
            background-color: transparent;
            margin-top: 15px;
            margin-bottom: 25px;
            border: 3px solid #ffb300;
            border-radius: 30px;
            box-shadow: 0 0 20px #ffb300;
        }

        h3 {
            display: inline;
            padding: 0;
            margin: 0;
        }
        
        div.container-2 {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 70px;
            background-color: transparent;
            margin-bottom: 25px;
            border: 3px solid #ffb300;
            border-radius: 30px;
            box-shadow: 0 0 20px #ffb300;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            appearance: none;
        }
        
        div.div-1,
        div.div-2 {
            display: inline-block;
            font-size: 25px;
            justify-content: left;
        }
        
        div.div-2 {
            margin-left: 40px;
            float: right;
            font-size: 25px;
        }
        
        button.sıfırla:hover {
            background: linear-gradient(#03009a, #000000, #03009a);
        }
        
        button.göndər:hover {
            background: linear-gradient(#03009a, #000000, #03009a);
            color: #ffb300;
        }
        
        select:hover,
        input:hover {
            background: linear-gradient(#03009a, #000000, #03009a);
            color: #ffb300;
        }
        
        button.göndər:active {
            background: linear-gradient(#000000, #03009a, #000000);
            color: #ffb300;
            transform: scale(0.9);
            cursor: grabbing !important;
        }
        
        select:active,
        input:active {
            background: linear-gradient(#000000, #03009a, #000000);
            color: #ffb300;
            transform: scale(0.9);
        }
        
        button.sıfırla:active {
            background: linear-gradient(#000000, #03009a, #000000);
            color: red;
            transform: scale(0.9);
            cursor: grabbing;
        }

        ::selection {
            background: #ffb300;
            color: #000000;
        }
        
        ::placeholder {
            color: #ffb300;
            opacity: 0.7;
        }
        
        input:user-invalid,
        select:user-invalid {
            border: 2px solid red;
        }
        
        input:user-valid,
        select:user-valid {
            border: 2px solid greenyellow;
            
        }
        
        input:focus,
        select:focus {
            border: 2px solid #ffb300;
            box-shadow: 0 0 25px rgba(255, 179, 0, 1);
            outline: none;
        }

        img {
            width: 30px; 
            height: 30px; 
            display: inline-block; 
            margin-right: 5px;
            transform: translateY(6px);
            user-select: none;
        }

        img.kopyalama {
            width: 20px;
            height: 20px;
        }

        img.göndər {
            display: inline-block;
            width: 20px;
            height: 20px;
            transform: translateY(-1px);
        }

        img.info {
            width: 25px;
            height: 25px;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        @media screen and (max-width: 1150px) {
            body {
                display: block;
                padding: 10px;
            }

            center {
                width: 100%;
            }

            div.conteiner {
                width: 100%;
                box-sizing: border-box;
                padding: 10px 15px;
                margin-top: 10px;
            }

            div.container-2 {
                width: 100%;
                box-sizing: border-box;
                height: auto;
                padding: 10px;
                font-size: 14px;
            }

            div.div-1, 
            div.div-2 {
                display: block;
                width: 100%;
                float: none;
                margin-left: 0;
            }

            input,
            select {
                width: 100% !important;
            }

            button.göndər, 
            button.sıfırla {
                width: 100%;
                margin: 10px 0;
            }
        }

        img.kopyalama:active {
            transform: scale(0.8) translateY(6px);
        }
</style>
</head>

<body>
    <div class="yüklənmə_animasiyası_arxa_fon">
        <div class="yüklənmə_animasiyası_dairə"></div>
    </div>
    <center>
        <h1>Boş vaxt sorğusu</h1>
        <div class="container-2">
            <h3><img src="{{ url_for('static', filename='diqqət.png') }}" alt="">
                Diqqət : Daxil elədiyiniz məlumatlar admin tərəfindən görünə bilər!</h3>
        </div>
        <div class="conteiner">
            <form action="{{ url_for('cavab') }}" method="POST">
                <span class="progress-qutu">
                    <span class="dilim d1"></span>
                    <span class="dilim d2"></span>
                    <span class="dilim d3"></span>
                    <span class="dilim d4"></span>
                    <span class="dilim d5"></span>
                    <span class="dilim d6"></span>
                    <span class="dilim d7"></span>
                    <span class="dilim d8"></span>
                    <span class="dilim d9"></span>
                    <span class="dilim d10"></span>
                </span>
                <div class="div-1">
                    <label>
                        <img src="{{ url_for('static', filename='ad.png') }}" alt="">
                        Ad:
                    </label>
                    <img src="{{ url_for('static', filename='kopyalama.png' )}}" alt="" onclick="navigator.clipboard.writeText(this.nextElementSibling.value)" class="kopyalama">
                    <input type="text" name="name" title="Zəhmət olmasa bu xananı boş qoymayın!"
                        placeholder="Adınızı daxil edin" required
                        oninvalid="this.setCustomValidity('Zəhmət olmasa bu xananı boş qoymayın!')"
                        oninput="this.setCustomValidity('')"><br>



                    <label>
                        <img src="{{ url_for('static', filename='fəaliyyət.png') }}" alt="">
                        Fəaliyyət Adı:
                    </label>
                    <img src="{{ url_for('static', filename='kopyalama.png' )}}" alt="" onclick="navigator.clipboard.writeText(this.nextElementSibling.value)" class="kopyalama">
                    <input type="text" name="activity" title="Zəhmət olmasa bu xananı boş qoymayın!" 
                        placeholder="Fəaliyyət adını daxil edin" required
                        oninvalid="this.setCustomValidity('Zəhmət olmasa bu xananı boş qoymayın!')"
                        oninput="this.setCustomValidity('')"><br>



                    <label>
                        <img src="{{ url_for('static', filename='kateqoriya.png') }}" alt="">
                        Kateqoriya:
                    </label>
                    <img src="{{ url_for('static', filename='kopyalama.png' )}}" alt="" onclick="navigator.clipboard.writeText(this.nextElementSibling.value)" class="kopyalama">
                    <select name="category" title="Zəhmət olmasa bu xananı boş qoymayın!" required
                        oninvalid="this.setCustomValidity('Zəhmət olmasa bu xananı boş qoymayın!')"
                        oninput="this.setCustomValidity('')">
                        <div class="option"><option value="">Birini seçin</option>
                        <option value="Texnologiya və proqramlaşdırma">Texnologiya və Proqramlaşdırma</option>
                        <option value="İntellektual və strategiya oyunları">İntellektual və Strategiya Oyunları</option>
                        <option value="İdman və fiziki fəaliyyət">İdman və Fiziki Fəaliyyət</option>
                        <option value="Kiberidman və videooyunlar">Kiberidman və Videooyunlar</option>
                        <option value="Rəqəmsal dizayn və qrafika">Rəqəmsal Dizayn və Qrafika</option>
                        <option value="Oxumaq və özünüinkişaf">Oxumaq və Özünüinkişaf</option>
                        <option value="Musiqi">Musiqi</option>
                        <option value="Əl İşləri və Konstruktorlar (DIY)">Əl İşləri və Konstruktorlar (DIY)</option>
                        <option value="Dil Öyrənmə">Dil Öyrənmə</option>
                        <option value="Elm və Tədqiqat">Elm və Tədqiqat</option>
                        <option value="Stolüstü və Kart Oyunları">Stolüstü və Kart Oyunları</option></div>
                        
                    </select><br>



                    <label>
                        <img src="{{ url_for('static', filename='yoldaş.png') }}" alt="">
                        Bu fəaliyyəti birlikdə elədiyin yoldaş:
                    </label>
                    <img src="{{ url_for('static', filename='kopyalama.png' )}}" alt="" onclick="navigator.clipboard.writeText(this.nextElementSibling.value)" class="kopyalama">
                    <select name="companion" title="Zəhmət olmasa bu xananı boş qoymayın!" required
                        oninvalid="this.setCustomValidity('Zəhmət olmasa bu xananı boş qoymayın!')"
                        oninput="this.setCustomValidity('')">
                        <option value="">Birini seçin</option>
                        <option value="Tək">Tək</option>
                        <option value="Qardaşım">Qardaşım</option>
                        <option value="Bacım">Bacım</option>
                        <option value="Anam">Anam</option>
                        <option value="Atam">Atam</option>
                        <option value="Dostum">Dostum</option>
                        <option value="Sinif yoldaşım">Sinif yoldaşım</option>
                        <option value="Qohumum">Qohumum</option>
                        <option value="Müəllim">Müəllimim</option>
                    </select><br>



                    <label>
                        <img src="{{ url_for('static', filename='yaş.png') }}" alt="">
                        Yaş:
                    </label>
                    <img src="{{ url_for('static', filename='kopyalama.png' )}}" alt="" onclick="navigator.clipboard.writeText(this.nextElementSibling.value)" class="kopyalama">
                    <input type="number" name="age" title="Zəhmət olmasa bu xananı boş qoymayın!" min="6" max="18"
                        placeholder="Yaşınızı daxil edin(6-18)" required
                        oninvalid="this.setCustomValidity('Zəhmət olmasa bu xananı boş qoymayın!')"
                        oninput="this.setCustomValidity('')"><br>
                </div>
                <div class="div-2">
                    <label>
                        <img src="{{ url_for('static', filename='sinif.png') }}" alt="">
                        Sinif:
                    </label>
                    <img src="{{ url_for('static', filename='kopyalama.png' )}}" alt="" onclick="navigator.clipboard.writeText(this.nextElementSibling.value)" class="kopyalama">
                    <select name="grade" title="Zəhmət olmasa bu xananı boş qoymayın!" required
                        oninvalid="this.setCustomValidity('Zəhmət olmasa bu xananı boş qoymayın!')"
                        oninput="this.setCustomValidity('')">
                        <option value="">Birini seçin</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                    </select>

                    <label>
                        <img src="{{ url_for('static', filename='həftənin günü.png') }}" alt="">
                        Həftənin hansı günü daha çox boş vaxtınız olur?:
                    </label>
                    <img src="{{ url_for('static', filename='kopyalama.png' )}}" alt="" onclick="navigator.clipboard.writeText(this.nextElementSibling.value)" class="kopyalama">
                    <select name="free_day" title="Zəhmət olmasa bu xananı boş qoymayın!" required
                        oninvalid="this.setCustomValidity('Zəhmət olmasa bu xananı boş qoymayın!')"
                        oninput="this.setCustomValidity('')">
                        <option value="">Birini seçin</option>
                        <option value="Bazar ertəsi">Bazar ertəsi</option>
                        <option value="Çərşənbə axşamı">Çərşənbə axşamı</option>
                        <option value="Çərşənbə">Çərşənbə</option>
                        <option value="Cümə axşamı">Cümə axşamı</option>
                        <option value="Cümə">Cümə</option>
                        <option value="Şənbə">Şənbə</option>
                        <option value="Bazar">Bazar</option>
                        <option value="Hər gün">Hər gün</option>
                    </select>

                    <label>
                        <img src="{{ url_for('static', filename='təqvim_saat.png') }}" alt="">
                        Bu fəaliyyətə nə qədər vaxt sərf edirsiniz?
                    </label>
                    <img src="{{ url_for('static', filename='kopyalama.png' )}}" alt="" onclick="navigator.clipboard.writeText(this.nextElementSibling.value)" class="kopyalama">
                    <input type="number" name="hours_per_day" min="0.1" max="12" step="0.1"
                        placeholder="0 ilə 12 saat arası" title="Zəhmət olmasa bu xananı boş qoymayın!" required
                        oninvalid="this.setCustomValidity('Zəhmət olmasa bu xananı boş qoymayın!')"
                        oninput="this.setCustomValidity('')">

                    <label>
                        <img src="{{ url_for('static', filename='xoşlamaq.png') }}" alt="">
                        Fəaliyyətinizdən nə qədər məmnunsunuz?
                    </label>
                    <img src="{{ url_for('static', filename='kopyalama.png' )}}" alt="" onclick="navigator.clipboard.writeText(this.nextElementSibling.value)" class="kopyalama">
                    <input type="number" name="satisfaction" required min="0.5" max="10" step="0.1"
                        placeholder="10 üzərindən" title="Zəhmət olmasa bu xananı boş qoymayın!"
                        oninvalid="this.setCustomValidity('Zəhmət olmasa bu xananı boş qoymayın!')"
                        oninput="this.setCustomValidity('')">

                    <label>
                        <img src="{{ url_for('static', filename='email.png') }}" alt="">
                        Email:
                    </label>
                    <img src="{{ url_for('static', filename='kopyalama.png' )}}" alt="" onclick="navigator.clipboard.writeText(this.nextElementSibling.value)" class="kopyalama">
                    <input type="email" name="email" title="Zəhmət olmasa bu xananı boş qoymayın!"
                        placeholder="Email adresiniz" required
                        oninvalid="this.setCustomValidity('Zəhmət olmasa bu xananı boş qoymayın!')"
                        oninput="this.setCustomValidity('')"><br>
                </div>
                <button type="submit" title="Göndərmək üçün bas!" class="göndər" onclick="s = document.getElementById('səs1').play()"><img src="{{  url_for('static', filename='göndər.png')  }}" alt="" class="göndər">Göndər</button>
                <button type="reset" title="Sıfırlamaq üçün bas!" class="sıfırla" onclick="s = document.getElementById('səs2').play()"><img src="{{  url_for('static', filename='sıfırla.png')  }}" alt="" class="göndər">Sıfırla</button>
                <audio src="{{ url_for('static', filename='pop.mp3') }}" id="səs1"></audio>
                <audio src="{{ url_for('static', filename='vuh.mp3') }}" id="səs2"></audio>
            </form>
        </div>
        <div class="container-3"><img src="{{ url_for('static', filename='info.png') }}" alt="" class="info"><h3>Əgər 2 və ya daha artıq hobbiniz varsa, ayrı-ayrı cavab göndərə bilərsiniz!</h3></div>
    </center>
    <img src="{{ url_for('static', filename='loqo1_seffaf_fon.png') }}" alt="Image"
        style="position: fixed; bottom: 0; right: 0; width: 100px; height: 100px;">
</body>

</html>
