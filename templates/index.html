<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anket</title>
    <link rel="icon" href='{{ url_for("static", filename="favicon.png") }}'>
<style>
    body {
        background-color: #3401ff;
        background: linear-gradient(to right, #000000, #03009a, #000000);
        background-attachment: fixed;
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #ffb300;
    }
    button {
        width: 150px;
        display: block;
        margin: 15px auto auto auto;
        padding: 10px 20px;
        justify-content: center;
        align-items: center;
        background: linear-gradient( #000000, #03009a, #000000);
        border: 3px solid #000000;
        border-radius: 40px;
        margin-bottom: 5px;
        color: #ffb300;
    }
    label {
        display: block;
        margin-top: 18px;
    }
    input, select {
        width: 300px;
        padding: 8px;
        margin: 5px;
        box-sizing: border-box;
        background: linear-gradient(#000000, #03009a, #000000);
        border: 3px solid #000000;
        border-radius: 40px;
        color: #ffb300;
    }   
    option {
        border-radius: 20px;
        background-color: #000000;
        color: #ffb300;
    }
    div.conteiner {
        display: absolute;
        max-height: 85%;
        background-color: transparent;
        padding: 0 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.70);
        width: 700px;
    }
    div.div-1, div.div-2 {
        display: inline-block;
    }
    div.div-1 {
        padding-right: 10px;
    }
    div.div-2 {
        float: right;
        position: right;
    }
    select:hover {
        background: linear-gradient( #03009a, #000000, #03009a);
        color: #ffb300;
    }
    input:hover {
        background: linear-gradient( #03009a, #000000, #03009a);
        color: #ffb300;
    }
    button:hover {
        background: linear-gradient( #03009a, #000000, #03009a);
        color: #ffb300;
    }
    select:active {
        background: linear-gradient( #000000, #03009a, #000000);
        color: #ffb300;
        transform: scale(0.95);
    }
    input:active {
        background: linear-gradient( #000000, #03009a, #000000);
        color: #ffb300;
        transform: scale(0.95);
        border: none;
    }
    button:active {
        background: linear-gradient( #000000, #03009a, #000000);
        color: #ffb300;
        transform: scale(0.9);
    }
    ::selection {
        background: #ffb300;
        color: #000000;
    }
</style>
</head>
<body>
    <div class="conteiner">
        <form action="/cavab" method="POST">
            <div class="div-1">
                <label>Ad:</label>
                <input type="text" name="name" required><br>

                <label>Fəaliyyət Adı:</label>
                <input type="text" name="activity" required><br>

                
                <label>Kateqoriya:</label>
                <select name="category" required>
                    <option value="Texnologiya_və_proqramlaşdırma">Texnologiya və Proqramlaşdırma</option>
                    <option value="İntellektual_və_strategiya_oyunları">İntellektual və Strategiya Oyunları</option>
                    <option value="İdman_və_fiziki_fəaliyyət">İdman və Fiziki Fəaliyyət</option>
                    <option value="Kiberidman_və_videooyunlar">Kiberidman və Videooyunlar</option>
                    <option value="Rəqəmsal_dizayn_və_qrafika">Rəqəmsal Dizayn və Qrafika</option>
                    <option value="Oxumaq_və_özünüinkişaf">Oxumaq və Özünüinkişaf</option>
                    <option value="Musiqi">Musiqi</option>
                    <option value="Əl_işləri_və_konstruktorlar">Əl İşləri və Konstruktorlar (DIY)</option>
                    <option value="Dil_öyrənmə">Dil Öyrənmə</option>
                    <option value="Elm_və_tədqiqat">Elm və Tədqiqat</option>
                    <option value="Stolüstü_və_kart_oyunları">Stolüstü və Kart Oyunları</option>
                </select><br>

                <label>Bu fəaliyyəti birlikdə elədiyin yoldaş:</label>
                <select name="companion" required>
                    <option value="">Tək</option>
                    <option value="Qardaşım">Qardaşım</option>
                    <option value="Bacım">Bacım</option>
                    <option value="Anam">Anam</option>
                    <option value="Atam">Atam</option>
                    <option value="Dostum">Dostum</option>
                    <option value="Sinif yoldaşım">Sinif yoldaşım</option>
                    <option value="Qohumum">Qohumum</option>
                    <option value="Müəllim">Müəllimim</option>
                </select><br>
                <label >Yaş:</label>
                <input type="number" name="age" min="6" max="18" required>
            </div>
            <div class="div-2">

                <label>Sinif:</label>
                <select name="grade" required>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                </select>

                <label>Həftənin hansı günü daha çox boş vaxtınız olur?:</label>
                <select name="free_day" required>
                    <option value="Bazar ertəsi">Bazar ertəsi</option>
                    <option value="Çərşəndə axşamı">Çərşəndə axşamı</option>
                    <option value="Çərşəbə">Çərşəbə</option>
                    <option value="Cümə axşamı">Cümə axşamı</option>
                    <option value="Cümə">Cümə</option>
                    <option value="Şənbə">Şənbə</option>
                    <option value="Bazar">Bazar</option>
                    <option value="Hər gün">Hər gün</option>
                </select>

                <label>Hobbi ilə neçə saat məşğul olursan?</label>
                <input type="number"name="hours_per_day" min="0.5" max="5" step="0.1" required>
                
                <label>Fəaliyyətinizdən nə qədər məmnunsunuz?:</label>
                <input type="number" name="satisfaction" min="0" max="10" step="0.5" required>
                
                <label>Email:</label>
                <input type="email" name="email" required><br>            
            </div>
            <button type="submit">Göndər</button>
        </form>
    </div>
</body>
</html>
